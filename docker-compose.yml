x-airflow-common:
  &airflow-common
  image: pipeline-airflow:3.3.2
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__LOGGING__LOG_CLI_COMMANDS: 'False'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    PYTHONPATH: /opt/airflow
    AIRFLOW_CONN_MSSQL_DEFAULT: "{\"conn_type\":\"mssql\",\"host\":\"sqlserver\",\"login\":\"${SQLSERVER_USER:-sa}\",\"password\":\"${MSSQL_SA_PASSWORD}\",\"schema\":\"${MSSQL_DATABASE:-ERP_DATABASE}\",\"port\":1433}"
    SQLSERVER_HOST: sqlserver
    SQLSERVER_USER: "${SQLSERVER_USER:-sa}"
    MSSQL_PORT: "1433"
    MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    FAKE_CATEGORIES: "${FAKE_CATEGORIES:-5}"
    FAKE_CUSTOMERS: "${FAKE_CUSTOMERS:-50}"
    FAKE_PRODUCTS: "${FAKE_PRODUCTS:-100}"
    FAKE_ORDERS: "${FAKE_ORDERS:-200}"
  volumes:
    - ./docker/dags:/opt/airflow/dags
    - ./data_font/fake_ingest_sqlserver_database:/opt/airflow/data_font/fake_ingest_sqlserver_database:ro
    - ./docker/logs:/opt/airflow/logs
    - ./docker/plugins:/opt/airflow/plugins
    - ./docker/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ============================================================================
  # 1. SOURCE DATABASE: SQL Server (ERP OLTP)
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  # ============================================================================
  # 2. AIRFLOW METADATA DATABASE: PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. APACHE AIRFLOW SERVICES (Airflow 3.x)
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username "${AIRFLOW_WWW_USER_USERNAME:-airflow}" --password "${AIRFLOW_WWW_USER_PASSWORD:-airflow}" --firstname "${AIRFLOW_WWW_USER_FIRSTNAME:-Airflow}" --lastname "${AIRFLOW_WWW_USER_LASTNAME:-Admin}" --role "${AIRFLOW_WWW_USER_ROLE:-Admin}" --email "${AIRFLOW_WWW_USER_EMAIL:-admin@example.com}" || airflow users reset-password --username "${AIRFLOW_WWW_USER_USERNAME:-airflow}" --password "${AIRFLOW_WWW_USER_PASSWORD:-airflow}"

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: airflow api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy

volumes:
  sqlserver_data:
  postgres_data: